[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "semantic-r1pro-abilities"
version = "0.4.0.dev1"
description = "基于 AbilityFramework 与 R1 Pro Robot SDK 的语义 Ability"
requires-python = ">=3.11"
license = "LicenseRef-Proprietary"
dependencies = [
  "ability-py>=0.4,<0.5",
  "PyYAML>=6,<7",
  "pydantic>=2.8,<3",
  "semantic-robot-sdk-core>=0.5.0.dev0,<0.6",
  "semantic-robot-sdk-r1pro>=0.5.0.dev0,<0.6",
]

[tool.setuptools.packages.find]
include = ["r1pro_abilities*"]
