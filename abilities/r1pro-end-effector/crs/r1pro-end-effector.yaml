kind: AtomAbility
metadata:
  name: r1pro-end-effector
spec:
  abilityName: R1ProEndEffector.V2
  package: semantic.r1pro.end-effector
  version: 0.4.0
  position: localhost
  config:
    robotDeploymentPath: configs/robot-deployment.fake.yaml
    executionStorePath: var/r1pro-end-effector.sqlite
  tasks:
    - { taskType: 0, taskName: SetOpening }
    - { taskType: 1, taskName: CloseUntilContact }
    - { taskType: 2, taskName: Release }
    - { taskType: 3, taskName: HoldObject }
    - { taskType: 4, taskName: GetExecution }
    - { taskType: 5, taskName: StopExecution }
  autoStart: false
  singleton: false
