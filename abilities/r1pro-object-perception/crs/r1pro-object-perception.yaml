kind: AtomAbility
metadata:
  name: r1pro-object-perception
spec:
  abilityName: R1ProObjectPerception.V2
  package: semantic.r1pro.object-perception
  version: 0.4.0
  position: localhost
  config:
    robotDeploymentPath: configs/robot-deployment.fake.yaml
    executionStorePath: var/r1pro-object-perception.sqlite
    modelRegistryPath: configs/models.example.json
  tasks:
    - { taskType: 0, taskName: LocateObject }
    - { taskType: 1, taskName: VerifyPregrasp }
    - { taskType: 2, taskName: VerifyGrasp }
    - { taskType: 3, taskName: ObservePlacementTarget }
    - { taskType: 4, taskName: VerifyPlacement }
    - { taskType: 5, taskName: GetExecution }
    - { taskType: 6, taskName: StopExecution }
  autoStart: false
  singleton: false
