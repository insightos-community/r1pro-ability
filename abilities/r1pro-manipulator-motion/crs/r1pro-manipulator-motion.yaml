kind: AtomAbility
metadata:
  name: r1pro-manipulator-motion
spec:
  abilityName: R1ProManipulatorMotion.V2
  package: semantic.r1pro.manipulator-motion
  version: 0.4.0
  position: localhost
  config:
    robotDeploymentPath: configs/robot-deployment.fake.yaml
    executionStorePath: var/r1pro-manipulator-motion.sqlite
  tasks:
    - { taskType: 0, taskName: MoveEndEffector }
    - { taskType: 1, taskName: FollowWaypoints }
    - { taskType: 2, taskName: LiftHeldObject }
    - { taskType: 3, taskName: MoveToPosture }
    - { taskType: 4, taskName: GetExecution }
    - { taskType: 5, taskName: StopExecution }
  autoStart: false
  singleton: false
