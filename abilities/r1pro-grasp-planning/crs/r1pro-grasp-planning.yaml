kind: AtomAbility
metadata:
  name: r1pro-grasp-planning
spec:
  abilityName: R1ProGraspPlanning.V2
  package: semantic.r1pro.grasp-planning
  version: 0.4.0
  position: localhost
  config:
    robotDeploymentPath: configs/robot-deployment.fake.yaml
    executionStorePath: var/r1pro-grasp-planning.sqlite
    modelRegistryPath: configs/models.example.json
  tasks:
    - { taskType: 0, taskName: GenerateCandidates }
    - { taskType: 1, taskName: GetExecution }
    - { taskType: 2, taskName: StopExecution }
  autoStart: false
  singleton: false
