name: CI and Release
'on':
  push:
    branches:
    - main
    tags:
    - v*
  pull_request: {}
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build and publish (for example v0.5.0-insightos.2026.2)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ inputs.tag || github.ref }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      tag: ${{ steps.target.outputs.tag }}
    steps:
    - name: Check out workflow implementation
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        path: automation
        persist-credentials: false
    - name: Select immutable source ref
      id: target
      env:
        TARGET_TAG: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || '' }}
        SOURCE_SHA: ${{ github.sha }}
      run: "if [[ -n \"$TARGET_TAG\" ]]; then\n  [[ \"$TARGET_TAG\" =~ ^v[0-9][0-9A-Za-z._+-]*$ ]] || { echo \"\
        Invalid version tag\" >&2; exit 1; }\n  echo \"ref=refs/tags/$TARGET_TAG\" >> \"$GITHUB_OUTPUT\"\nelse\n\
        \  echo \"ref=$SOURCE_SHA\" >> \"$GITHUB_OUTPUT\"\nfi\necho \"tag=$TARGET_TAG\" >> \"$GITHUB_OUTPUT\"\n"
    - name: Check out component source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ steps.target.outputs.ref }}
        path: source
        fetch-depth: 0
        persist-credentials: false
    - name: Set up uv
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
      with:
        version: 0.12.12
        enable-cache: true
    - name: Test and build component
      working-directory: source
      env:
        TARGET_TAG: ${{ steps.target.outputs.tag }}
        COMPONENT: r1pro-ability
        GH_TOKEN: ${{ github.token }}
      run: bash ../automation/.github/scripts/build.sh
    - name: Validate and package release assets
      working-directory: source
      env:
        TARGET_TAG: ${{ steps.target.outputs.tag }}
        COMPONENT: r1pro-ability
      run: python3 ../automation/.github/scripts/package.py
    - name: Upload verified component artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: release-assets
        path: source/.output/release/*
        if-no-files-found: error
        retention-days: 14
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
    - name: Check out publishing implementation
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Download verified component artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: release-assets
        path: release-assets
    - name: Publish tag release
      env:
        GH_TOKEN: ${{ github.token }}
        TARGET_TAG: ${{ needs.build.outputs.tag }}
      run: python3 .github/scripts/publish.py
